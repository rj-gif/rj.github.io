<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live xG-skudkort</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    h2 {
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 20px;
      font-weight: 700;
    }
    svg {
      width: 100%;
      height: auto;
      cursor: crosshair;
      border-radius: 12px;
      background-color: #166534;
      display: block;
    }
    .shot-marker {
      cursor: pointer;
    }
    .shot-marker:hover {
      opacity: 0.85;
    }
    .stat-label {
      color: #64748b;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: 16px;
    }
    .stat {
      font-size: 36px;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.1;
      margin-bottom: 8px;
    }
    .stat-xg {
      color: #059669;
    }
    .muted {
      color: #64748b;
      font-size: 13px;
      margin-top: 12px;
      line-height: 1.4;
    }
    button, select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #ffffff;
      margin: 6px 0;
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    button:hover {
      background: #f1f5f9;
      border-color: #94a3b8;
    }
    .btn-danger {
      color: #dc2626;
      border-color: #fca5a5;
    }
    .btn-danger:hover {
      background: #fef2f2;
      border-color: #f87171;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .xg-table-card {
      grid-column: 1 / -1;
    }
    .xg-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }
    .xg-table th, .xg-table td {
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
      font-size: 14px;
    }
    .xg-table th {
      background-color: #f8fafc;
      color: #64748b;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .xg-table tr:hover {
      background-color: #f1f5f9;
    }
    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="grid">
    <!-- Pitch Canvas Card -->
    <div class="card">
      <h2>Live xG-skudkort</h2>
      <svg id="pitch" viewBox="0 0 700 430">
        <!-- Banens ramme & græs (Grøn bane med hvide streger) -->
        <rect x="15" y="15" width="670" height="400" fill="#166534" stroke="#ffffff" stroke-width="2.5" rx="4"/>
        <line x1="350" y1="15" x2="350" y2="415" stroke="#ffffff" stroke-width="2"/>
        <circle cx="350" cy="215" r="55" fill="none" stroke="#ffffff" stroke-width="2"/>
        <circle cx="350" cy="215" r="3" fill="#ffffff"/>
        
        <!-- Venstre felt -->
        <rect x="15" y="110" width="105" height="210" fill="none" stroke="#ffffff" stroke-width="2"/>
        <rect x="15" y="155" width="55" height="120" fill="none" stroke="#ffffff" stroke-width="2"/>
        
        <!-- Højre felt (Mål-siden) -->
        <rect x="580" y="110" width="105" height="210" fill="none" stroke="#ffffff" stroke-width="2"/>
        <rect x="630" y="155" width="55" height="120" fill="none" stroke="#ffffff" stroke-width="2"/>
        <circle cx="605" cy="215" r="2.5" fill="#ffffff"/>
        <path d="M 580 170 A 55 55 0 0 0 580 260" fill="none" stroke="#ffffff" stroke-width="2"/>
        
        <!-- Skudmarkører lag -->
        <g id="shots"></g>
      </svg>
      <p class="muted">
        💡 <strong>Klik på banen</strong> for at registrere et skud.<br>
        Klik på en skudmarkør for at skifte mellem Mål (mørk) og Ikke mål (hvid).
      </p>
    </div>

    <!-- Live Stats Sidebar Card -->
    <div class="card">
      <h2>Live statistik</h2>
      
      <div class="stat-label">Samlet xG</div>
      <div id="xg" class="stat stat-xg">0.00</div>
      
      <div class="stat-label">Skud i alt</div>
      <div id="count" class="stat">0</div>
      
      <div class="stat-label">Mål</div>
      <div id="goals" class="stat">0</div>

      <div style="margin-top: 20px;">
        <label class="stat-label" for="result" style="display: block; margin-bottom: 4px;">Næste skud resultat</label>
        <select id="result">
          <option value="no">Ikke mål</option>
          <option value="goal">⚽ Mål</option>
        </select>
      </div>

      <div class="btn-group">
        <button id="undo">Fortryd</button> 
        <button id="reset" class="btn-danger">Nulstil</button>
      </div>
    </div>

    <!-- Tabel for akkumuleret xG -->
    <div class="card xg-table-card">
      <h2>Akkumuleret xG oversigt</h2>
      <div style="overflow-x: auto;">
        <table class="xg-table">
          <thead>
            <tr>
              <th>Skud #</th>
              <th>Resultat</th>
              <th>Skud xG</th>
              <th>Akkumuleret xG</th>
            </tr>
          </thead>
          <tbody id="xg-table-body">
            <!-- Rækker indsættes dynamisk via JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const pitch = document.getElementById('pitch');
      const layer = document.getElementById('shots');
      const resSelect = document.getElementById('result');
      const tableBody = document.getElementById('xg-table-body');
      let shots = [];

      const clamp = (val, min, max) => Math.max(min, Math.min(max, val));

      // Matematisk præcis xG-beregning baseret på synsvinkel til målet og afstand
      function calculateXG(x, y) {
        let targetX = 685; // Mållinjen placeret på højre banekant (x = 685)
        let posX = Math.min(x, targetX - 2); // Sikrer at skuddet er foran mållinjen
        
        let dx = targetX - posX;
        let dy = 215 - y;
        let dist = Math.hypot(dx, dy);

        // Koordinater for højre måls stolper (y=190 og y=240)
        let p1x = targetX - posX, p1y = 190 - y;
        let p2x = targetX - posX, p2y = 240 - y;

        // Vinkel mellem skudposition og målstolperne (i radianer)
        let dot = p1x * p2x + p1y * p2y;
        let mag1 = Math.hypot(p1x, p1y);
        let mag2 = Math.hypot(p2x, p2y);
        let cosAngle = clamp(dot / (mag1 * mag2), -1, 1);
        let angle = Math.acos(cosAngle);

        // xG som funktion af synlig målvinkel og afstandsaftagning
        let angleFactor = Math.pow(Math.sin(angle / 2), 0.8);
        let distFactor = Math.exp(-dist / 110);
        let rawXG = 1.45 * angleFactor * distFactor;

        return clamp(rawXG, 0.01, 0.85);
      }

      function render() {
        layer.innerHTML = '';
        
        shots.forEach((shot, index) => {
          let group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          group.classList.add('shot-marker');

          // Cirkelstørrelse baseret svagt på xG (radius mellem 15px og 24px)
          let radius = clamp(15 + shot.xg * 12, 15, 24);

          // Hovedcirkel for skuddet
          let circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          circle.setAttribute('cx', shot.x);
          circle.setAttribute('cy', shot.y);
          circle.setAttribute('r', radius);
          circle.setAttribute('fill', shot.goal ? '#0f172a' : '#ffffff');
          circle.setAttribute('stroke', '#0f172a');
          circle.setAttribute('stroke-width', '2.5');

          // Tekst inde i cirklen: viser xG-værdi (f.eks. "0.32")
          let textXG = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          textXG.setAttribute('x', shot.x);
          textXG.setAttribute('y', shot.y + 4);
          textXG.setAttribute('text-anchor', 'middle');
          textXG.setAttribute('font-size', '11');
          textXG.setAttribute('font-weight', '800');
          textXG.setAttribute('fill', shot.goal ? '#ffffff' : '#0f172a');
          textXG.textContent = shot.xg.toFixed(2);

          // Lille badge for skudnummer (1, 2, 3...)
          let badgeX = shot.x + radius * 0.7;
          let badgeY = shot.y - radius * 0.7;

          let badgeBg = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          badgeBg.setAttribute('cx', badgeX);
          badgeBg.setAttribute('cy', badgeY);
          badgeBg.setAttribute('r', '8');
          badgeBg.setAttribute('fill', '#2563eb');
          badgeBg.setAttribute('stroke', '#ffffff');
          badgeBg.setAttribute('stroke-width', '1.5');

          let badgeText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          badgeText.setAttribute('x', badgeX);
          badgeText.setAttribute('y', badgeY + 3);
          badgeText.setAttribute('text-anchor', 'middle');
          badgeText.setAttribute('font-size', '9');
          badgeText.setAttribute('font-weight', '800');
          badgeText.setAttribute('fill', '#ffffff');
          badgeText.textContent = index + 1;

          // Tilføj alle elementer til gruppen
          group.append(circle, textXG, badgeBg, badgeText);

          // Skift mål/ikke-mål ved klik på skud
          group.onclick = (e) => {
            e.stopPropagation();
            shot.goal = !shot.goal;
            render();
          };

          layer.append(group);
        });

        // Opdater samlet statistik
        let totalXG = shots.reduce((acc, shot) => acc + shot.xg, 0);
        let totalGoals = shots.filter(shot => shot.goal).length;

        document.getElementById('xg').textContent = totalXG.toFixed(2);
        document.getElementById('count').textContent = shots.length;
        document.getElementById('goals').textContent = totalGoals;

        // Opdater akkumuleret xG-tabel
        tableBody.innerHTML = '';
        let accumXG = 0;

        if (shots.length === 0) {
          tableBody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #94a3b8; padding: 16px;">Ingen skud registreret endnu. Klik på banen for at tilføje skud.</td></tr>';
        } else {
          shots.forEach((shot, index) => {
            accumXG += shot.xg;
            let tr = document.createElement('tr');
            tr.innerHTML = `
              <td><strong>#${index + 1}</strong></td>
              <td>${shot.goal ? '⚽ <span style="color: #059669; font-weight: 700;">Mål</span>' : '<span style="color: #64748b;">Ikke mål</span>'}</td>
              <td>${shot.xg.toFixed(2)}</td>
              <td><strong style="color: #059669;">${accumXG.toFixed(2)}</strong></td>
            `;
            tableBody.appendChild(tr);
          });
        }
      }

      // Registrer nyt skud ved klik på banen
      pitch.onclick = (e) => {
        if (e.target.closest('#shots g')) return;

        let rect = pitch.getBoundingClientRect();
        let viewBox = pitch.viewBox.baseVal;
        let x = (e.clientX - rect.left) * viewBox.width / rect.width;
        let y = (e.clientY - rect.top) * viewBox.height / rect.height;

        // Baneanfældning
        if (x < 15 || x > 685 || y < 15 || y > 415) return;

        shots.push({
          x: x,
          y: y,
          goal: resSelect.value === 'goal',
          xg: calculateXG(x, y)
        });

        render();
      };

      document.getElementById('undo').onclick = () => {
        shots.pop();
        render();
      };

      document.getElementById('reset').onclick = () => {
        shots = [];
        render();
      };

      render();
    })();
  </script>
</body>
</html>
